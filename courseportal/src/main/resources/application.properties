spring.application.name=courseportal

# Database - uses env vars in production, falls back to local for dev
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/course_portal}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:Saitej@406}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Server port - Render injects PORT automatically
server.port=${PORT:8080}

# CORS - set your Vercel URL in Render env vars
app.frontend.url=${FRONTEND_URL:http://localhost:3000}